name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack (pnpm 12.8.1)
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build packages (tokens → react → registry → cli/mcp)
        run: corepack pnpm -r --if-present run build
      - name: Build registry manifest + skill references
        run: corepack pnpm run registry:build
      - name: Build docs (base /cwa-design/)
        run: corepack pnpm --filter @cwa-design/docs exec vite build --base=/cwa-design/
      - name: Build Storybook (base /cwa-design/storybook/)
        working-directory: apps/storybook
        env:
          STORYBOOK_BASE: /cwa-design/storybook/
        run: corepack pnpm run build
      - name: Assemble site
        run: |
          mkdir -p site/storybook
          cp -r apps/docs/dist/* site/
          cp -r apps/storybook/storybook-static/* site/storybook/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
